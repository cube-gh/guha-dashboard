# 매일 아침 세계 인기 사이트 TOP10을 받아 top10.json으로 저장하는 자동 작업
name: 세계 인기 사이트 TOP10 갱신

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 한국 시간 오전 6시 17분
  workflow_dispatch:        # Actions 탭에서 직접 실행도 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: TOP10 받아오기
        run: |
          python3 - <<'PY'
          import csv, io, json, re, urllib.request, zipfile, datetime

          UA = {"User-Agent": "guha-dashboard-top10/1.0"}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60) as r:
                  return r.read()

          # 1) 사람이 실제로 방문하는 주요 웹사이트 후보 (같은 서비스의 주소는 하나로 묶음)
          #    → 기기·서버가 자동으로 접속하는 주소(CCTV, 업데이트, 광고 등)는 아예 뽑히지 않음
          CAND = {
            "google.com":"Google", "youtube.com":"YouTube", "facebook.com":"Facebook", "instagram.com":"Instagram",
            "chatgpt.com":"ChatGPT", "wikipedia.org":"Wikipedia", "x.com":"X", "twitter.com":"X",
            "whatsapp.com":"WhatsApp", "reddit.com":"Reddit", "bing.com":"Bing", "yahoo.com":"Yahoo",
            "yahoo.co.jp":"Yahoo Japan", "baidu.com":"Baidu", "yandex.ru":"Yandex", "amazon.com":"Amazon",
            "tiktok.com":"TikTok", "linkedin.com":"LinkedIn", "netflix.com":"Netflix", "pinterest.com":"Pinterest",
            "twitch.tv":"Twitch", "discord.com":"Discord", "telegram.org":"Telegram", "spotify.com":"Spotify",
            "github.com":"GitHub", "ebay.com":"eBay", "naver.com":"NAVER", "duckduckgo.com":"DuckDuckGo",
            "quora.com":"Quora", "imdb.com":"IMDb", "zoom.us":"Zoom", "temu.com":"Temu", "aliexpress.com":"AliExpress",
            "weather.com":"Weather.com", "bilibili.com":"Bilibili", "qq.com":"QQ", "vk.com":"VK", "roblox.com":"Roblox",
            "canva.com":"Canva", "openai.com":"ChatGPT", "claude.ai":"Claude", "msn.com":"MSN", "cnn.com":"CNN",
            "bbc.com":"BBC", "bbc.co.uk":"BBC", "nytimes.com":"New York Times", "espn.com":"ESPN", "fandom.com":"Fandom",
            "paypal.com":"PayPal", "booking.com":"Booking.com", "walmart.com":"Walmart", "globo.com":"Globo",
            "disneyplus.com":"Disney+", "primevideo.com":"Prime Video", "threads.net":"Threads", "threads.com":"Threads",
            "snapchat.com":"Snapchat", "tumblr.com":"Tumblr", "stackoverflow.com":"Stack Overflow", "medium.com":"Medium",
            "daum.net":"Daum", "coupang.com":"Coupang", "line.me":"LINE", "weibo.com":"Weibo", "zhihu.com":"Zhihu",
            "mail.ru":"Mail.ru", "ok.ru":"OK", "samsung.com":"Samsung", "office.com":"Microsoft 365", "outlook.com":"Outlook"
          }
          # 같은 서비스로 묶을 주소 → 대표 주소
          SAME = {"twitter.com":"x.com", "openai.com":"chatgpt.com", "bbc.co.uk":"bbc.com", "threads.com":"threads.net"}

          # 2) Tranco 최신 순위 (상위 10,000개)에서 후보의 순위를 찾음
          ranks = {}
          try:
              info = json.loads(get("https://tranco-list.eu/api/lists/date/latest"))
              data = get(f"https://tranco-list.eu/download/{info['list_id']}/10000").decode()
              rows = csv.reader(io.StringIO(data))
          except Exception as e:
              print("API 실패, 전체 목록으로 대신:", e)
              z = zipfile.ZipFile(io.BytesIO(get("https://tranco-list.eu/top-1m.csv.zip")))
              rows = (line.strip().split(",") for i, line in enumerate(io.TextIOWrapper(z.open(z.namelist()[0]))) if i < 10000)
          for r in rows:
              if len(r) < 2: continue
              d = r[1].strip().lower()
              if d not in CAND: continue
              key = SAME.get(d, d)
              ranks[key] = min(ranks.get(key, 10**9), int(r[0]))

          top = [{"rank": i + 1, "domain": d, "name": CAND[d], "tranco": rk}
                 for i, (d, rk) in enumerate(sorted(ranks.items(), key=lambda x: x[1])[:10])]

          kst = datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=9)
          out = {"date": kst.strftime("%Y-%m-%d"), "source": "Tranco (tranco-list.eu) · 주요 웹사이트 후보 중 순위", "sites": top}
          json.dump(out, open("top10.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY

      - name: 바뀐 내용 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top10.json
          git diff --cached --quiet || git commit -m "TOP10 갱신 $(date -u +%F)"
          git push
